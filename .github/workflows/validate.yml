name: Validate ACP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  schemas-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic validation
        run: python tests/validate_schemas.py
